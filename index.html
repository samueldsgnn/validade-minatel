<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D43A8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Validade Minatel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Validade · Minatel Supermercados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  color-scheme: light;
  --azul:#0D43A8; --azul-esc:#0A3486; --azul-cl:#1A5BD0; --azul-suave:#E6EEFB;
  --vermelho-marca:#E8291F;
  --fundo:#F1F3F7; --superficie:#FFFFFF; --superficie-2:#F5F7FA; --linha:#DFE4EC;
  --tinta:#121722; --tinta-2:#5C6676;
  --verde:#12994F; --verde-suave:#E3F5EA;
  --amarelo:#EDB400; --amarelo-tinta:#3F3000; --amarelo-suave:#FFF5D3;
  --vermelho:#D7261C; --vermelho-suave:#FDE6E3;
  --vencido:#6B0E13; --vencido-suave:#F3DBDC;
  --cinza:#8F98A6;
  --sombra:0 1px 2px rgba(18,23,34,.06), 0 4px 14px rgba(18,23,34,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --azul-suave:#1A2740;
    --fundo:#0E131B; --superficie:#18202B; --superficie-2:#202A37; --linha:#2D3848;
    --tinta:#EEF2F7; --tinta-2:#A4AFBE;
    --verde:#2DBE70; --verde-suave:#15301F;
    --amarelo:#F3C431; --amarelo-tinta:#2A2000; --amarelo-suave:#352C0B;
    --vermelho:#F0503D; --vermelho-suave:#3A1914;
    --vencido:#C04754; --vencido-suave:#34171B;
    --cinza:#7A8595;
    --sombra:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --azul-suave:#1A2740;
  --fundo:#0E131B; --superficie:#18202B; --superficie-2:#202A37; --linha:#2D3848;
  --tinta:#EEF2F7; --tinta-2:#A4AFBE;
  --verde:#2DBE70; --verde-suave:#15301F;
  --amarelo:#F3C431; --amarelo-tinta:#2A2000; --amarelo-suave:#352C0B;
  --vermelho:#F0503D; --vermelho-suave:#3A1914;
  --vencido:#C04754; --vencido-suave:#34171B;
  --cinza:#7A8595;
  --sombra:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--azul-esc)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul-cl);outline-offset:2px}
img{max-width:100%;display:block}

.topo{background:radial-gradient(120% 140% at 50% 0%,var(--azul-cl),var(--azul) 55%,var(--azul-esc));color:#fff;padding:10px 14px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 10px rgba(10,52,134,.35)}
.topo-in{max-width:760px;margin:0 auto}
.marca{display:flex;align-items:center;gap:12px}
.logo{height:56px;width:auto;border-radius:10px}
.marca-txt{flex:1;min-width:0}
.marca-txt b{display:block;font-weight:900;font-size:1.12rem;line-height:1.1}
.marca-txt span{font-size:.8rem;opacity:.85}
.icone-btn{background:rgba(255,255,255,.15);border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:#fff;flex:none}
.busca{margin-top:10px;display:flex;align-items:center;background:#fff;border-radius:999px;padding:4px 4px 4px 14px;gap:8px;color:#5C6676}
.busca input{flex:1;border:0;background:transparent;padding:9px 0;font-size:1rem;color:#121722;min-width:0}
.busca input:focus{outline:none}
.busca .scan{border:0;background:var(--azul);color:#fff;border-radius:999px;height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;flex:none}

/* selos das marcas, como as categorias de um app de mercado */
.marcas{background:var(--superficie);box-shadow:var(--sombra)}
.marcas-in{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:12px 8px 10px;scrollbar-width:none}
.marcas-in::-webkit-scrollbar{display:none}
.selo-marca{flex:0 0 76px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.selo-marca .bola{width:64px;height:64px;border-radius:50%;border:3px solid var(--linha);background:var(--superficie-2);overflow:hidden;display:grid;place-items:center;font-weight:900;font-size:1.15rem;color:#fff}
.selo-marca .bola img{width:100%;height:100%;object-fit:cover;background:#fff}
.selo-marca small{font-size:.74rem;color:var(--tinta-2);font-weight:700;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.selo-marca .cont{position:absolute;top:0;right:4px;background:var(--azul);color:#fff;font-size:.68rem;font-weight:900;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--superficie)}
.selo-marca[aria-pressed="true"] .bola{border-color:var(--azul-cl);box-shadow:0 0 0 2px var(--azul-cl)}
.selo-marca[aria-pressed="true"] small{color:var(--azul-cl)}
.selo-todas .bola{background:var(--azul-suave);color:var(--azul-cl)}

/* situação da validade */
.situacoes{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:12px 10px 2px;scrollbar-width:none}
.situacoes::-webkit-scrollbar{display:none}
.sit{flex:none;border:1.5px solid var(--linha);background:var(--superficie);border-radius:999px;padding:7px 12px 7px 9px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:.85rem;white-space:nowrap}
.sit i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.sit b{font-weight:900}
.sit[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.sit[aria-pressed="true"] i{background:#fff}
.s-todos{--c:var(--azul-cl)} .s-vencido{--c:var(--vencido)} .s-vermelho{--c:var(--vermelho)} .s-amarelo{--c:var(--amarelo)} .s-verde{--c:var(--verde)}
.s-amarelo[aria-pressed="true"]{color:var(--amarelo-tinta)}
.s-amarelo[aria-pressed="true"] i{background:var(--amarelo-tinta)}

.conteudo{max-width:760px;margin:0 auto;padding:10px 10px 170px}
.titulo-lista{margin:6px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.titulo-lista b{font-weight:900;font-size:1rem}
.titulo-lista span{font-size:.85rem;color:var(--tinta-2);white-space:nowrap}

.item{display:grid;grid-template-columns:1fr 62px;gap:8px;margin-bottom:10px}
.card{background:var(--superficie);border-radius:14px;box-shadow:var(--sombra);border:0;padding:12px 12px 10px;text-align:left;display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto 1fr auto;column-gap:12px;min-width:0}
.foto{grid-row:1 / 3;width:96px;height:96px;border-radius:14px;overflow:hidden;border:4px solid var(--cor);background:#fff;position:relative}
.foto img{width:100%;height:100%;object-fit:contain}
.foto::after{content:"";position:absolute;inset:0;background:var(--cor);opacity:var(--tinte,0);mix-blend-mode:multiply;pointer-events:none}
.sem-foto{width:100%;height:100%;display:grid;place-items:center;font-weight:900;font-size:1.7rem;color:var(--tinta-2);background:var(--superficie-2)}
.cab{text-align:right;min-width:0}
.cab .mc{display:block;font-size:.72rem;font-weight:900;color:var(--azul-cl);text-transform:uppercase;letter-spacing:.02em}
.nome{font-weight:900;text-transform:uppercase;font-size:.95rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tam{display:inline-block;margin-top:4px;background:var(--azul-suave);color:var(--azul-cl);font-weight:900;font-size:.8rem;border-radius:6px;padding:1px 7px}
.info{text-align:right;font-size:.82rem;color:var(--tinta-2);align-self:end}
.info b{font-size:1rem;color:var(--tinta)}
.faixa{grid-column:1 / 3;margin-top:10px;background:var(--cor);color:var(--cor-tinta);border-radius:999px;display:flex;align-items:center;gap:10px;padding:3px 14px 3px 3px;min-height:46px}
.faixa .dias{width:40px;height:40px;border-radius:50%;background:var(--superficie);color:var(--cor-num,var(--cor));border:2px solid var(--cor);display:grid;place-items:center;font-weight:900;font-size:.95rem;line-height:1;flex:none;text-align:center}
.faixa .dias small{display:block;font-size:.55rem;font-weight:700}
.faixa strong{font-weight:900;text-transform:uppercase;font-size:.92rem;line-height:1.1;display:block}
.faixa em{font-style:normal;font-size:.75rem;opacity:.9}
.st-verde{--cor:var(--verde);--cor-tinta:#fff}
.st-amarelo{--cor:var(--amarelo);--cor-tinta:var(--amarelo-tinta);--cor-num:var(--amarelo-tinta);--tinte:.12}
.st-vermelho{--cor:var(--vermelho);--cor-tinta:#fff;--tinte:.25}
.st-vencido{--cor:var(--vencido);--cor-tinta:#fff;--tinte:.42}
.st-sem{--cor:var(--cinza);--cor-tinta:#fff}
.st-vermelho .faixa{animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{50%{filter:brightness(1.15)}}
@media (prefers-reduced-motion: reduce){.st-vermelho .faixa{animation:none}}

.passo-v{background:var(--superficie);border-radius:14px;box-shadow:var(--sombra);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0}
.passo-v button{border:0;background:none;width:100%;height:44px;font-size:1.7rem;font-weight:900;color:var(--azul-cl);line-height:1}
.passo-v button.menos{color:var(--vermelho-marca)}
.passo-v output{font-weight:900;font-size:1.25rem}
.passo-v small{font-size:.62rem;color:var(--tinta-2);text-align:center;line-height:1.1;padding:0 4px}

.vazio{background:var(--superficie);border-radius:16px;padding:28px 20px;text-align:center;box-shadow:var(--sombra)}
.vazio h3{margin:0 0 6px;font-weight:900;font-size:1.2rem}
.vazio p{margin:0 auto;color:var(--tinta-2);max-width:34ch}
.carregando{color:var(--tinta-2);text-align:center;padding:40px 0}
.estado{font-size:.8rem;color:var(--tinta-2);text-align:center;margin-top:20px}

.rodape{position:fixed;left:0;right:0;bottom:0;z-index:6}
.resumo{max-width:760px;margin:0 auto;background:var(--superficie);border-radius:14px 14px 0 0;box-shadow:0 -4px 14px rgba(18,23,34,.1);padding:9px 14px;display:flex;align-items:center;gap:10px;border:0;width:100%;text-align:left}
.resumo .ponto{width:12px;height:12px;border-radius:50%;background:var(--vermelho);flex:none}
.resumo.ok .ponto{background:var(--verde)}
.resumo b{font-weight:900;font-size:.9rem;display:block}
.resumo span{font-size:.78rem;color:var(--tinta-2)}
.nav{background:var(--azul);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{background:none;border:0;color:rgba(255,255,255,.78);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;padding:6px 0}
.nav button[aria-current="true"]{color:#fff}
.nav .centro{color:#fff}
.nav .centro .bolha{width:62px;height:62px;border-radius:50%;background:#fff;color:var(--azul);display:grid;place-items:center;margin-top:-30px;box-shadow:0 4px 14px rgba(0,0,0,.25);border:4px solid var(--vermelho-marca)}

.vela{position:fixed;inset:0;background:rgba(8,14,26,.58);z-index:20;display:none;align-items:flex-end;justify-content:center}
.vela.aberta{display:flex}
.folha{background:var(--superficie);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion: reduce){.folha{animation:none}}
@media (min-width:700px){.vela{align-items:center}.folha{border-radius:22px;max-height:88vh}}
.alca{width:44px;height:5px;border-radius:3px;background:var(--linha);margin:2px auto 12px}
.folha-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.folha-topo h3{margin:0;font-weight:900;font-size:1.25rem;line-height:1.2}
.fechar{background:var(--superficie-2);border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn-pri{background:var(--azul);color:#fff}
.btn-sec{background:var(--superficie);color:var(--tinta);border:1.5px solid var(--linha)}
.btn-perigo{background:var(--vermelho-suave);color:var(--vermelho)}
.btn-peq{min-height:40px;padding:8px 14px;font-size:.88rem}
.btn-bloco{width:100%}
.btn:disabled{opacity:.55;cursor:default}

#leitor{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:220px}
#leitor video{width:100%!important;border-radius:16px}
.aviso{background:var(--amarelo-suave);color:var(--tinta);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.ok-msg{background:var(--verde-suave);color:var(--tinta);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:0 0 6px}
.ou{display:flex;align-items:center;gap:10px;color:var(--tinta-2);font-size:.85rem;margin:16px 0 10px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--linha)}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 6px}
.campo{width:100%;border:1.5px solid var(--linha);background:var(--superficie-2);border-radius:12px;padding:12px;font-size:1rem}
.campo:focus{outline:none;border-color:var(--azul-cl)}
.linha2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.linha-tam{display:grid;grid-template-columns:1fr 110px;gap:8px}
.dica{font-size:.82rem;color:var(--tinta-2);margin-top:4px}
.foto-pegar{display:flex;gap:12px;align-items:center}
.foto-mini{width:110px;height:110px;border-radius:14px;background:#fff;border:1.5px dashed var(--linha);overflow:hidden;display:grid;place-items:center;flex:none;color:var(--tinta-2);position:relative}
.foto-mini img{width:100%;height:100%;object-fit:contain}
.foto-mini .girando{width:30px;height:30px;border-radius:50%;border:3px solid var(--linha);border-top-color:var(--azul-cl);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.foto-botoes{display:flex;flex-direction:column;gap:8px;min-width:0}
.opcoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.opcoes button{aspect-ratio:1/1;border-radius:12px;border:2px solid var(--linha);background:#fff;padding:2px;overflow:hidden}
.opcoes button[aria-pressed="true"]{border-color:var(--azul-cl);box-shadow:0 0 0 2px var(--azul-cl)}
.opcoes img{width:100%;height:100%;object-fit:contain}

.det-topo{display:flex;gap:14px;align-items:center}
.det-foto{width:110px;height:110px;border-radius:16px;overflow:hidden;border:5px solid var(--cor);flex:none;background:#fff}
.det-foto img{width:100%;height:100%;object-fit:contain}
.det-foto .sem-foto{font-size:1.8rem}
.det-mc{font-size:.78rem;font-weight:900;color:var(--azul-cl);text-transform:uppercase}
.det-nome{font-weight:900;text-transform:uppercase;font-size:1.15rem;line-height:1.15;margin:0 0 4px}
.det-cod{font-size:.85rem;color:var(--tinta-2)}
.selo{display:inline-block;margin-top:6px;background:var(--cor);color:var(--cor-tinta);font-weight:900;font-size:.8rem;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.lotes{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.lote{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;background:var(--superficie-2);border-radius:14px;padding:10px 10px 10px 0;overflow:hidden}
.lote-cor{align-self:stretch;background:var(--cor);border-radius:0 4px 4px 0}
.lote-data{font-weight:900}
.lote-dias{font-size:.84rem;color:var(--tinta-2)}
.lote-dias.forte{color:var(--cor);font-weight:700}
.st-amarelo .lote-dias.forte{color:var(--tinta)}
.primeiro{font-size:.7rem;font-weight:900;background:var(--azul);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;text-transform:uppercase}
.passo{display:flex;align-items:center;gap:4px}
.passo button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--linha);background:var(--superficie);font-size:1.2rem;font-weight:900;display:grid;place-items:center}
.passo output{min-width:34px;text-align:center;font-weight:900;font-size:1.05rem}
.novo-lote{background:var(--azul-suave);border-radius:16px;padding:4px 14px 14px;margin-top:16px}
.novo-lote.destaque{outline:3px solid var(--azul-cl)}
.acoes{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.acoes .btn{flex:1}
.zerados{margin-top:10px;font-size:.85rem;color:var(--tinta-2)}
.link{background:none;border:0;color:var(--azul-cl);font-weight:700;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--fundo);padding:12px 16px;border-radius:12px;font-weight:700;z-index:40;max-width:calc(100% - 28px);box-shadow:var(--sombra);display:none}
.toast.on{display:block}
.secao{border-top:1px solid var(--linha);margin-top:20px;padding-top:6px}
.secao h4{margin:10px 0 4px;font-weight:900}
.credito{font-size:.75rem;color:var(--tinta-2);margin-top:6px}
.btn-foto-ia{justify-content:flex-start;gap:14px;padding:12px 18px;margin-bottom:10px;text-align:left}
.btn-foto-ia span{display:flex;flex-direction:column;line-height:1.15}
.btn-foto-ia small{font-weight:400;font-size:.8rem;opacity:.85}
.girando-peq{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:gira .8s linear infinite;vertical-align:-2px;margin-right:4px}
.campo.auto{border-color:var(--verde);background:var(--verde-suave)}
.opcoes button{position:relative}
.tag-sua{position:absolute;left:3px;bottom:3px;background:var(--tinta);color:var(--fundo);font-size:.62rem;font-weight:900;border-radius:5px;padding:0 5px}
@media (prefers-reduced-motion: reduce){.girando-peq,.foto-mini .girando{animation-duration:2.4s}}
</style>
</head>
<body>

<header class="topo">

<script>
(function(){
"use strict";
const produtos = new Map();
let cfg = { vermelho: 4, amarelo: 15 };
let filtro = null, marcaSel = null, termo = "", carregado = false;
const LS_P = "validade:produtos", LS_C = "validade:config";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlSegura = u => (typeof u === "string" && (u.startsWith("https://") || u.startsWith("data:image/"))) ? u : "";

/* ===== datas e cores ===== */
function hoje(){ const h = new Date(); h.setHours(0,0,0,0); return h; }
function dias(v){ const [y,m,d] = v.split("-").map(Number); return Math.round((new Date(y,m-1,d) - hoje())/864e5); }
function status(n){ if(n < 0) return "vencido"; if(n <= cfg.vermelho) return "vermelho"; if(n <= cfg.amarelo) return "amarelo"; return "verde"; }
function textoDias(n){
  if(n < -1) return `Venceu há ${-n} dias`;
  if(n === -1) return "Venceu ontem";
  if(n === 0) return "Vence hoje";
  if(n === 1) return "Vence amanhã";
  return `Vence em ${n} dias`;
}
function dataBR(v){ const [y,m,d] = v.split("-"); return `${d}/${m}/${y}`; }
function lotesAtivos(p){ return (p.lotes||[]).filter(l => l.qtd > 0).sort((a,b) => a.validade.localeCompare(b.validade)); }
function resumo(p){
  const at = lotesAtivos(p);
  const total = at.reduce((s,l) => s + l.qtd, 0);
  if(!at.length) return { st:"sem", total:0, n:null, prox:null, nLotes:0 };
  const n = dias(at[0].validade);
  return { st: status(n), total, n, prox: at[0], nLotes: at.length };
}
const rotulo = { verde:"Em dia", amarelo:"Atenção", vermelho:"Vencendo", vencido:"Vencido", sem:"Sem estoque" };

/* ===== marcas e tamanho ===== */
function chaveMarca(m){ return (m||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function corMarca(m){ let h = 0; for(const c of chaveMarca(m)) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 42%)`; }
const UNIDADES = ["g","kg","ml","L","un"];
function lerTamanho(txt){
  if(!txt) return null;
  const m = String(txt).replace(",", ".").match(/(\d+(?:\.\d+)?)\s*(kg|mg|g|ml|cl|l|lt|litros?|un|unid|unidades?)\b/i);
  if(!m) return null;
  let num = parseFloat(m[1]), un = m[2].toLowerCase();
  if(un === "cl"){ num = num * 10; un = "ml"; }
  else if(un === "mg"){ num = num / 1000; un = "g"; }
  else if(un.startsWith("l")) un = "L";
  else if(un.startsWith("un")) un = "un";
  return { num: String(+num.toFixed(3)).replace(".", ","), un };
}
function textoTamanho(p){ return p.tamanho ? String(p.tamanho) : ""; }

/* ===== armazenamento no aparelho (IndexedDB, com espaço para muitas fotos) ===== */
const IDB = {
  _p: null,
  abrir(){
    if(!this._p) this._p = new Promise((ok, falha) => {
      const r = indexedDB.open("validade-minatel", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => ok(r.result);
      r.onerror = () => falha(r.error);
    });
    return this._p;
  },
  async get(k){ const db = await this.abrir(); return new Promise((ok, falha) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => falha(q.error); }); },
  async set(k, v){ const db = await this.abrir(); return new Promise((ok, falha) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => ok(); tx.onerror = () => falha(tx.error); }); }
};
async function carregar(){
  try{ const c = JSON.parse(localStorage.getItem(LS_C) || "null"); if(c) cfg = { ...cfg, ...c }; }catch(e){}
  let lista = null;
  try{ lista = await IDB.get("produtos"); }catch(e){}
  if(!Array.isArray(lista)){
    // primeira vez nesta versão: traz o que estava salvo na versão anterior
    try{ lista = JSON.parse(localStorage.getItem(LS_P) || "[]"); }catch(e){ lista = []; }
    if(lista.length){ try{ await IDB.set("produtos", lista); }catch(e){} }
  }
  lista.forEach(p => produtos.set(p.id, p));
  carregado = true;
  render();
}
let tGravar;
function gravar(){
  clearTimeout(tGravar);
  tGravar = setTimeout(async () => {
    const lista = [...produtos.values()];
    try{ await IDB.set("produtos", lista); }
    catch(e){
      try{ localStorage.setItem(LS_P, JSON.stringify(lista)); }catch(e2){ toast("Não foi possível salvar neste aparelho."); }
    }
  }, 250);
}
function salvarProduto(p){ p.atualizado = Date.now(); produtos.set(p.id, p); render(); gravar(); }
function excluirProduto(id){ produtos.delete(id); if(marcaSel && !marcasAtuais().some(m => m.chave === marcaSel)) marcaSel = null; render(); gravar(); }
function salvarConfig(){ try{ localStorage.setItem(LS_C, JSON.stringify(cfg)); }catch(e){} render(); }

/* ===== busca automática de produto e foto (Open Food Facts) ===== */
const BASES = ["https://world.openfoodfacts.org", "https://world.openbeautyfacts.org", "https://world.openproductsfacts.org"];
const CAMPOS = "code,product_name,product_name_pt,generic_name_pt,brands,quantity,image_front_url,image_front_small_url,image_url,image_small_url";
async function pegarJSON(url, ms = 9000){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try{ const r = await fetch(url, { signal: ctrl.signal }); if(!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
  finally{ clearTimeout(t); }
}
function normalizar(pr){
  if(!pr) return null;
  const nome = (pr.product_name_pt || pr.product_name || pr.generic_name_pt || "").trim();
  const marca = (pr.brands || "").split(",")[0].trim();
  const foto = urlSegura(pr.image_front_url || pr.image_url || "");
  const mini = urlSegura(pr.image_front_small_url || pr.image_small_url || "") || foto;
  const tam = lerTamanho(pr.quantity);
  return { nome, marca, foto, mini, tam, codigo: pr.code || "" };
}
async function buscarPorCodigo(codigo){
  if(!/^\d{6,14}$/.test(codigo)) return null;
  for(const base of BASES){
    const j = await pegarJSON(`${base}/api/v2/product/${codigo}.json?fields=${CAMPOS}`);
    if(j && j.status === 1 && j.product){
      const p = normalizar(j.product);
      if(p && (p.nome || p.foto)) return p;
    }
  }
  return null;
}
async function buscarPorNome(nome){
  const q = encodeURIComponent(nome.trim());
  const base = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${q}&search_simple=1&action=process&json=1&page_size=24&fields=${CAMPOS}`;
  // primeiro só produtos vendidos no Brasil, depois no mundo todo
  const urls = [`${base}&tagtype_0=countries&tag_contains_0=contains&tag_0=brazil`, base];
  const vistos = new Set(), res = [];
  for(const u of urls){
    const j = await pegarJSON(u, 12000);
    for(const pr of (j && j.products) || []){
      const p = normalizar(pr);
      if(p && p.foto && !vistos.has(p.foto)){ vistos.add(p.foto); res.push(p); }
      if(res.length >= 8) break;
    }
    if(res.length >= 4) break;
  }
  return res;
}
// guarda a foto dentro do app (funciona sem internet); se o site não deixar, guarda o link
async function guardarFoto(url){
  if(!url || url.startsWith("data:")) return url;
  try{
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch(url, { signal: ctrl.signal, mode: "cors" }); clearTimeout(t);
    if(!r.ok) return url;
    return await reduzirImagem(await r.blob());
  }catch(e){ return url; }
}
function reduzirImagem(blob, max = 400, qualidade = .74){
  return new Promise((ok, falha) => {
    const img = new Image(), u = URL.createObjectURL(blob);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", qualidade));
    };
    img.onerror = () => { URL.revokeObjectURL(u); falha(); };
    img.src = u;
  });
}

/* ===== lista ===== */
function iniciais(n){ return (n||"?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase(); }
function marcasAtuais(){
  const mapa = new Map();
  for(const p of produtos.values()){
    const ch = chaveMarca(p.marca); if(!ch) continue;
    if(!mapa.has(ch)) mapa.set(ch, { chave: ch, nome: p.marca.trim(), qtd: 0, foto: "" });
    const m = mapa.get(ch); m.qtd++; if(!m.foto && p.foto) m.foto = p.foto;
  }
  return [...mapa.values()].sort((a,b) => b.qtd - a.qtd || a.nome.localeCompare(b.nome));
}
function renderMarcas(){
  const ms = marcasAtuais();
  $("#listaMarcas").innerHTML = ms.map(m => `<option value="${esc(m.nome)}">`).join("");
  const semMarca = [...produtos.values()].filter(p => !chaveMarca(p.marca)).length;
  $("#marcas").innerHTML = `
    <button class="selo-marca selo-todas" data-marca="" aria-pressed="${marcaSel === null}"><span class="bola"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></span><small>Todas</small></button>
    ${ms.map(m => `<button class="selo-marca" data-marca="${esc(m.chave)}" aria-pressed="${marcaSel === m.chave}">
      <span class="bola" style="background:${m.foto ? "#fff" : corMarca(m.nome)}">${m.foto ? `<img src="${esc(urlSegura(m.foto))}" alt="" loading="lazy">` : esc(iniciais(m.nome))}</span>
      <span class="cont">${m.qtd}</span><small>${esc(m.nome)}</small></button>`).join("")}

  try{ navigator.vibrate && navigator.vibrate(70); }catch(e){}

    const ac = new (window.AudioContext || window.webkitAudioContext)();

    o.frequency.value = 1550; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .13);
    o.start(); o.stop(ac.currentTime + .14);
  }catch(e){}
}

async function lerCodigoNaFoto(arq){

async function identificarNaIA(dataUrl){

    const r = await fetch("/api/identificar", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ imagem: dataUrl }), signal: ctrl.signal });
    const j = await r.json().catch(() => null);
    if(!r.ok || !j) return { erro: (j && j.erro) || (r.status === 404 ? "sem_servidor" : "falha") };

  }catch(e){ return { erro: "rede" }; }

  }
  if(buscaForm !== minha){ liberar(); return; }
  if(cand.length){ fotoTemp = cand[0].foto; fotoManual = false; }
  mostrarFoto(); renderOpcoes(cand);
  liberar();

  const unicos = [...new Set(preenchidos)];
  let txt = unicos.length ? `Pronto! Preenchi sozinho: <b>${unicos.join(", ")}</b>.` : "";
  txt += cand.length ? ` Coloquei uma foto da internet; se preferir a sua, toque nela abaixo.` : " Não achei foto melhor na internet, mantive a sua.";
  if(unicos.includes("validade")) txt += " <b>Confira a validade</b> lida na embalagem.";
  if(ia && ia.erro) txt = `${ERROS_IA[ia.erro] || ERROS_IA.falha} ` + (cand.length ? "Mas achei uma foto pela base de produtos." : "Preencha o nome que eu busco a foto.");
  else if(!okIA && !base) txt = "Não reconheci o produto nessa foto. Tente uma foto mais de frente, mostrando o nome, ou digite o nome.";
  msgBusca(txt.trim(), (ia && ia.erro) || (!okIA && !base) ? "aviso" : "ok-msg");
  const v = $("#fVal"); if(v && !v.value) v.focus();
}
function aplicarDadosOpcao(o){
  preencherSeVazio("#fMarca", o.marca);
  const tn = $("#fTamNum");
  if(o.tam && tn && !tn.value.trim()){ tn.value = o.tam.num; $("#fTamUn").value = o.tam.un; }
}
function novoLoteId(){ return "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
async function salvarForm(id){
  const nome = $("#fNome").value.trim();
  if(!nome){ toast("Digite o nome do produto."); $("#fNome").focus(); return; }
  const marca = $("#fMarca").value.trim();
  const tn = $("#fTamNum").value.trim();
  const tamanho = tn ? `${tn} ${$("#fTamUn").value}` : "";
  const btn = document.querySelector('[data-acao="salvarForm"]'); if(btn){ btn.disabled = true; btn.textContent = "Salvando…"; }
  const foto = await guardarFoto(fotoTemp);
  if(id){
    const p = produtos.get(id); if(!p) return;
    salvarProduto({ ...p, nome, marca, tamanho, foto });
    abrirProduto(id); toast("Alterações salvas"); return;
  }
  const codigo = $("#fCod").value.trim();
  const novoId = codigo ? idDeCodigo(codigo) : "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  if(codigo && produtos.has(novoId)){ toast("Esse código já está cadastrado."); abrirProduto(novoId, true); return; }
  const val = $("#fVal").value, qtd = parseInt($("#fQtd").value, 10);
  const lotes = [];
  if(val){ if(!(qtd > 0)){ toast("Informe a quantidade."); if(btn){ btn.disabled = false; btn.textContent = "Cadastrar produto"; } return; } lotes.push({ id: novoLoteId(), validade: val, qtd }); }
  salvarProduto({ id:novoId, nome, marca, tamanho, codigo, foto, lotes, criado:Date.now() });
  toast("Produto cadastrado");
  abrirProduto(novoId, !val);
}

/* ===== detalhe ===== */
function abrirProduto(id, focarNovaValidade){
  const p = produtos.get(id); if(!p) return;
  const r = resumo(p), at = lotesAtivos(p);
  const zerados = (p.lotes||[]).filter(l => !(l.qtd > 0)).length;
  const foto = urlSegura(p.foto);
  abrirFolha(`${topoFolha("Produto")}
    <div class="det-topo st-${r.st}">
      <div class="det-foto">${foto ? `<img src="${esc(foto)}" alt="">` : `<div class="sem-foto">${esc(iniciais(p.nome))}</div>`}</div>
      <div>
        ${p.marca ? `<div class="det-mc">${esc(p.marca)}</div>` : ""}
        <p class="det-nome">${esc(p.nome)}</p>
        <div class="det-cod">${p.tamanho ? `<span class="tam">${esc(p.tamanho)}</span> ` : ""}${p.codigo ? "Código " + esc(p.codigo) + " · " : ""}${r.total} un. no estoque</div>
        <span class="selo">${esc(rotulo[r.st])}${r.prox ? " · " + esc(textoDias(r.n).toLowerCase()) : ""}</span>
      </div>
    </div>
    ${at.length ? `<ul class="lotes">${at.map((l, i) => { const n = dias(l.validade), s = status(n); return `
      <li class="lote st-${s}">
        <span class="lote-cor"></span>
        <div><div class="lote-data">${dataBR(l.validade)}${i === 0 && at.length > 1 ? `<span class="primeiro">Usar primeiro</span>` : ""}</div>
        <div class="lote-dias ${s !== "verde" ? "forte" : ""}">${esc(textoDias(n))}</div></div>
        <div class="passo">
          <button data-acao="menos" data-id="${esc(id)}" data-lote="${esc(l.id)}" data-det="1" aria-label="Tirar uma unidade">−</button>
          <output>${l.qtd}</output>
          <button data-acao="mais" data-id="${esc(id)}" data-lote="${esc(l.id)}" data-det="1" aria-label="Somar uma unidade">+</button>
        </div>
      </li>`; }).join("")}</ul>` : `<p class="aviso">Nenhuma validade com estoque. Adicione abaixo.</p>`}
    ${zerados ? `<p class="zerados">${zerados} validade(s) zerada(s) escondida(s). <button class="link" data-acao="limparZerados" data-id="${esc(id)}">Apagar</button></p>` : ""}
    <div class="novo-lote ${focarNovaValidade ? "destaque" : ""}">
      <label for="nlVal">Adicionar validade</label>
      <div class="linha2">
        <input class="campo" type="date" id="nlVal" aria-label="Data de validade">
        <input class="campo" type="number" id="nlQtd" min="1" value="1" inputmode="numeric" aria-label="Quantidade">
      </div>
      <button class="btn btn-pri btn-bloco" style="margin-top:10px" data-acao="addLote" data-id="${esc(id)}">Adicionar ao estoque</button>
      <p class="dica">Mesma data de um lote que já existe? A quantidade é somada nele.</p>
    </div>
    <div class="acoes">
      <button class="btn btn-sec" data-acao="editar" data-id="${esc(id)}">Editar</button>
      <button class="btn btn-sec" data-acao="bipar">Bipar outro</button>
      <button class="btn btn-perigo" data-acao="excluir" data-id="${esc(id)}">Excluir</button>
    </div>`, { tipo:"produto", id });
  if(focarNovaValidade) setTimeout(() => { const v = $("#nlVal"); if(v){ v.scrollIntoView({ block:"center" }); v.focus(); } }, 120);
}
function mudarQtd(id, loteId, delta, noDetalhe){
  const p = produtos.get(id); if(!p) return;
  const lotes = p.lotes.map(l => l.id === loteId ? { ...l, qtd: Math.max(0, l.qtd + delta) } : l);
  salvarProduto({ ...p, lotes });
  if(noDetalhe) abrirProduto(id);
}
function addLote(id){
  const p = produtos.get(id); if(!p) return;
  const val = $("#nlVal").value, qtd = parseInt($("#nlQtd").value, 10);
  if(!val){ toast("Escolha a data de validade."); $("#nlVal").focus(); return; }
  if(!(qtd > 0)){ toast("Informe a quantidade."); return; }
  const lotes = (p.lotes||[]).map(l => ({ ...l }));
  const igual = lotes.find(l => l.validade === val);
  if(igual) igual.qtd += qtd; else lotes.push({ id:novoLoteId(), validade:val, qtd });
  salvarProduto({ ...p, lotes });
  toast(`${qtd} un. adicionada(s) · ${textoDias(dias(val)).toLowerCase()}`);
  abrirProduto(id);
}

/* ===== completar produtos já cadastrados ===== */
let completando = false;
async function completarTodos(){
  if(completando) return;
  const alvo = [...produtos.values()].filter(p => !p.foto || !p.marca || !p.tamanho);
  if(!alvo.length){ toast("Todos os produtos já têm foto, marca e tamanho."); return; }
  completando = true;
  const btn = $("#btnCompletar"); if(btn) btn.disabled = true;
  let feitos = 0, achados = 0, buscasNome = 0;
  for(const p0 of alvo){
    feitos++;
    if(btn) btn.textContent = `Buscando ${feitos} de ${alvo.length}…`;
    let r = p0.codigo ? await buscarPorCodigo(p0.codigo) : null;
    let foto = r && r.foto;
    if(!foto && !p0.foto && p0.nome){
      if(buscasNome > 0) await new Promise(ok => setTimeout(ok, 6500)); // respeita o limite de buscas por nome
      buscasNome++;
      const lista = await buscarPorNome([p0.nome, p0.marca].filter(Boolean).join(" "));
      if(lista.length){ foto = lista[0].foto; r = r || lista[0]; }
    }
    const p = produtos.get(p0.id); if(!p) continue;
    const novo = { ...p };
    if(!novo.foto && foto) novo.foto = await guardarFoto(foto);
    if(!novo.marca && r && r.marca) novo.marca = r.marca;
    if(!novo.tamanho && r && r.tam) novo.tamanho = `${r.tam.num} ${r.tam.un}`;
    if(novo.foto !== p.foto || novo.marca !== p.marca || novo.tamanho !== p.tamanho){ achados++; salvarProduto(novo); }
  }
  completando = false;
  if(btn){ btn.disabled = false; btn.textContent = "Buscar fotos e dados que faltam"; }
  toast(`Pronto: ${achados} de ${alvo.length} produto(s) completados.`);
}

/* ===== ajustes ===== */
function abrirConfig(){
  const faltando = [...produtos.values()].filter(p => !p.foto || !p.marca || !p.tamanho).length;
  abrirFolha(`${topoFolha("Ajustes")}
    <div class="linha2" style="grid-template-columns:1fr 1fr">
      <div><label for="cVerm">Vermelho: faltando até</label><input class="campo" type="number" id="cVerm" min="0" value="${cfg.vermelho}" inputmode="numeric"></div>
      <div><label for="cAmar">Amarelo: faltando até</label><input class="campo" type="number" id="cAmar" min="1" value="${cfg.amarelo}" inputmode="numeric"></div>
    </div>
    <p class="dica">Em dias. Acima do amarelo, o produto fica verde. Produto que já passou da data fica vinho, como vencido.</p>
    <div class="acoes"><button class="btn btn-pri" data-acao="salvarConfig">Salvar cores</button></div>
    <div class="secao">
      <h4>Completar produtos já cadastrados</h4>
      <p class="dica">${faltando ? `${faltando} produto(s) sem foto, marca ou tamanho. O app procura pelo código de barras e, se não achar, pelo nome.` : "Todos os produtos já estão completos."}</p>
      ${faltando ? `<button class="btn btn-sec btn-bloco" style="margin-top:8px" data-acao="completar" id="btnCompletar">${completando ? "Buscando…" : "Buscar fotos e dados que faltam"}</button><p class="dica">Pode levar alguns minutos. Deixe o app aberto.</p>` : ""}
    </div>`, { tipo:"config" });
}

/* ===== eventos ===== */
document.addEventListener("click", async e => {
  const card = e.target.closest("[data-abrir]");
  if(card){ abrirProduto(card.dataset.abrir); return; }
  const mc = e.target.closest(".selo-marca");
  if(mc){ const m = mc.dataset.marca || null; marcaSel = (m && marcaSel === m) ? null : m; render(); window.scrollTo({ top:0 }); return; }
  const s = e.target.closest(".sit");
  if(s){ const f = s.dataset.f || null; filtro = (f && filtro === f) ? null : f; render(); return; }
  const b = e.target.closest("[data-acao]"); if(!b) return;
  const id = b.dataset.id;
  switch(b.dataset.acao){
    case "fechar": fecharFolha(); break;
    case "bipar": abrirScanner(); break;
    case "novo": abrirForm({}); break;
    case "config": abrirConfig(); break;
    case "inicio": filtro = null; marcaSel = null; termo = ""; $("#busca").value = ""; render(); window.scrollTo({ top:0 }); break;
    case "verVencendo": filtro = "vermelho"; render(); window.scrollTo({ top:0 }); break;
    case "usarCodigo": { const v = $("#codManual").value; await pararScanner(); tratarCodigo(v); break; }
    case "tirarFoto": $("#arqFoto").click(); break;
    case "galeria": $("#arqGaleria").click(); break;
    case "fotoSemCodigo": { pararScanner(); abrirForm({}); $("#arqFoto").click(); break; }
    case "abrirExistente": abrirProduto(id, true); break;
    case "buscarFoto": fotoManual = false; preencherFotoPorNome($("#fNome").value, $("#fMarca").value.trim()); break;
    case "escolherOpcao": {
      const op = $("#opcoes"); const o = op && op._res && op._res[+b.dataset.i]; if(!o) break;
      fotoTemp = o.foto; fotoManual = !!o.propria; mostrarFoto(); if(!o.propria) aplicarDadosOpcao(o);
      op.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      break;
    }
    case "salvarForm": salvarForm(id || null); break;
    case "menos": mudarQtd(id, b.dataset.lote, -1, !!b.dataset.det); break;
    case "mais": mudarQtd(id, b.dataset.lote, +1, !!b.dataset.det); break;
    case "abrirNovaData": abrirProduto(id, true); break;
    case "addLote": addLote(id); break;
    case "editar": abrirForm({ id }); break;
    case "completar": completarTodos(); break;
    case "limparZerados": { const p = produtos.get(id); if(p){ salvarProduto({ ...p, lotes:p.lotes.filter(l => l.qtd > 0) }); abrirProduto(id); } break; }
    case "excluir": { const p = produtos.get(id); if(p && confirm(`Excluir "${p.nome}" e todas as validades dele?`)){ excluirProduto(id); fecharFolha(); toast("Produto excluído"); } break; }
    case "salvarConfig": {
      const v = parseInt($("#cVerm").value, 10), a = parseInt($("#cAmar").value, 10);
      if(!(v >= 0) || !(a > v)){ toast("O amarelo precisa ser maior que o vermelho."); return; }
      cfg = { vermelho:v, amarelo:a }; salvarConfig(); fecharFolha(); toast("Ajustes salvos"); break;
    }
  }
});
document.addEventListener("change", async e => {
  if((e.target.id === "arqFoto" || e.target.id === "arqGaleria") && e.target.files[0]){
    const arq = e.target.files[0]; e.target.value = "";
    identificarPorFoto(arq);
  }
  // ao terminar de digitar o nome de um produto sem foto, busca a foto sozinho
  if(e.target.id === "fNome" && !fotoTemp && e.target.value.trim().length >= 3){
    preencherFotoPorNome(e.target.value, ($("#fMarca") || {}).value);
  }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target.id === "codManual"){ e.preventDefault(); pararScanner().then(() => tratarCodigo(e.target.value)); }
  if(e.target.id === "nlQtd" || e.target.id === "nlVal"){ e.preventDefault(); const bt = document.querySelector('[data-acao="addLote"]'); if(bt) addLote(bt.dataset.id); }
});
$("#busca").addEventListener("input", e => { termo = e.target.value; render(); });
$("#busca").addEventListener("keydown", e => {
  if(e.key === "Enter" && /^\d{6,14}$/.test(e.target.value.trim())){
    e.preventDefault(); const c = e.target.value.trim(); e.target.value = ""; termo = ""; render(); bip(); tratarCodigo(c);
  }
});
let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2800); }
setInterval(() => { if(carregado) render(); }, 60 * 60 * 1000);
render();
carregar();
if("serviceWorker" in navigator){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
})();
</script>
</body>
</html>
